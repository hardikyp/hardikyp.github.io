name: Build Generated Site Assets

on:
  push:
    branches:
      - main
    paths:
      - "*.html"
      - "projects/*.html"
      - "publications/*.html"
      - "updates/*.html"
      - "teaching/*.html"
      - "photography/*.html"
      - "design-system/*.html"
      - "assets/partials/**"
      - "assets/data/**"
      - "projects/data/**"
      - "publications/data/**"
      - "updates/data/**"
      - "teaching/data/**"
      - "photography/data/**"
      - "assets/img/projects/**"
      - "assets/img/updates/gallery/**"
      - "assets/img/updates/thumbnails/**"
      - "assets/photography/**"
      - "assets/img/user.png"
      - "scripts/inline_partials.py"
      - "scripts/generate_responsive_images.py"
      - "scripts/prerender_content.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-generated-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-on-main:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: python -m pip install --upgrade pillow

      - name: Sync generated site artifacts
        run: |
          python scripts/inline_partials.py
          python scripts/generate_responsive_images.py
          python scripts/prerender_content.py

      - name: Commit generated artifacts
        run: |
          if git diff --quiet; then
            echo "No generated changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .
          git commit -m "chore: sync generated site assets"

          git pull --rebase origin main
          git push
