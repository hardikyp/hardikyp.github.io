name: Sync Shared Partials

on:
  pull_request:
    paths:
      - "*.html"
      - "projects/*.html"
      - "publications/*.html"
      - "updates/*.html"
      - "teaching/*.html"
      - "photography/*.html"
      - "design-system/*.html"
      - "assets/partials/**"
      - "scripts/inline_partials.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify synced partials
        run: python scripts/inline_partials.py --check
