name: Update Sitemap

on:
  push:
    branches:
      - main
    paths:
      - "updates/data/updates.json"
      - "projects/data/*.json"
      - "teaching/data/teaching.json"
      - "index.html"
      - "projects/index.html"
      - "publications/index.html"
      - "updates/index.html"
      - "photography/index.html"
      - "teaching/index.html"
      - "scripts/generate_sitemap.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate sitemap.xml
        run: python scripts/generate_sitemap.py

      - name: Commit sitemap changes
        run: |
          if git diff --quiet -- sitemap.xml; then
            echo "No sitemap changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git commit -m "chore: update sitemap"
          git push

