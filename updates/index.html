    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "CollectionPage",
        "name": "Updates",
        "description": "News, awards, publications, and milestones from Hardik Patil's structural engineering research and professional work.",
        "url": "https://hardikpatil.com/updates/",
        "isPartOf": {
          "@type": "WebSite",
          "name": "Hardik Patil",
          "url": "https://hardikpatil.com/"
        },
        "breadcrumb": {
          "@type": "BreadcrumbList",
          "itemListElement": [
            { "@type": "ListItem", "position": 1, "name": "Home", "item": "https://hardikpatil.com/" },
            { "@type": "ListItem", "position": 2, "name": "Updates", "item": "https://hardikpatil.com/updates/" }
          ]
        }
      }

  <body class="page-updates">
    <a class="skip-link" href="#main">Skip to content</a>
    <div data-include="/assets/partials/header.html"></div>
    <main id="main" tabindex="-1" class="pubs updates-page">
      <section class="updates-hero contained">
        <p class="eyebrow">Latest</p>
        <h1>Updates</h1>
        <p class="muted">Announcements, milestones, awards, publications and more.</p>
      </section>
      <section class="updates-feed contained" aria-label="Latest updates">
        <div class="update-list"></div>
        <!-- To add another update, duplicate an <article class="update-card"> block above and update the tag, date, image, copy, and link. -->
      </section>
    </main>
    <div data-include="/assets/partials/back-to-top.html"></div>
    <div data-include="/assets/partials/footer.html"></div>
    <script src="/assets/js/includes.js"></script>
    <script src="/assets/js/updates.js" defer></script>
    <!-- Admin-only: load update generator when ?admin=1 or ?admin is present -->
    <script>
      (function() {
        try {
          const params = new URLSearchParams(window.location.search);
          if (!params.has('admin')) return;
          const load = (src) => new Promise((resolve) => {
            const s = document.createElement('script');
            s.src = src;
            s.defer = true;
            s.onload = resolve;
            s.onerror = resolve;
            document.head.appendChild(s);
          });
          load('/assets/js/update-admin-config.js').then(() => load('/assets/js/update-generator.js'));
        } catch (_) {}
      })();
    </script>
    <script src="/assets/js/main.js" defer></script>
  </body>
